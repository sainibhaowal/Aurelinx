name: Semantic Release, Container & Desktop Build

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto, patch, minor, major)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      build_desktop:
        description: 'Build desktop installers (slow; leave off for web/API releases)'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: write

# One release operation may calculate and publish a version for a branch at a
# time. This prevents two manual runs from selecting the same next tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    name: Prepare Semantic Release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Configure Git User
        run: |
          git config --global user.name "Ravinder Singh"
          git config --global user.email "251900306+sainibhaowal@users.noreply.github.com"

      - name: Install Release Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Reconcile Release Metadata
        run: |
          git fetch --force --tags origin
          node scripts/reconcile-release-version.js

      - name: Verify Current Release Metadata
        run: npm run verify:release

      - name: Bump Version & Open Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "auto" ]; then
            npx standard-version --skip.tag
          else
            npx standard-version --skip.tag --release-as ${{ github.event.inputs.release_type }}
          fi
          NEW_VER=$(node -p "require('./package.json').version")
          NEW_TAG="v${NEW_VER}"
          if git ls-remote --exit-code --tags origin "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing remote release tag: ${NEW_TAG}" >&2
            exit 1
          fi
          npm run verify:release

          RELEASE_BRANCH="release/${NEW_TAG}"
          git checkout -B "${RELEASE_BRANCH}"
          git push --force origin "${RELEASE_BRANCH}"

          gh workflow run ci.yml --ref "${RELEASE_BRANCH}" || true

          PR_TITLE="chore(release): ${NEW_TAG}"
          if [ "${{ github.event.inputs.build_desktop }}" = "true" ]; then
            PR_TITLE="chore(release): ${NEW_TAG} [build-desktop]"
          fi
          PR_BODY="Automated semantic release PR for \`${NEW_TAG}\`. Merging this PR into \`${{ github.ref_name }}\` will automatically tag \`${NEW_TAG}\`, publish container images, and create the GitHub Release."
          COMPARE_URL="https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...${RELEASE_BRANCH}?expand=1"

          EXISTING_PR=$(gh pr list --head "${RELEASE_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -z "${EXISTING_PR}" ]; then
            set +e
            PR_OUT=$(gh pr create \
              --base "${{ github.ref_name }}" \
              --head "${RELEASE_BRANCH}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}" 2>&1)
            PR_RC=$?
            set -e
            if [ "${PR_RC}" -eq 0 ]; then
              echo "Created Release PR: ${PR_OUT}"
              echo "Created Release PR for \`${NEW_TAG}\`: ${PR_OUT}" >> "$GITHUB_STEP_SUMMARY"
            elif echo "${PR_OUT}" | grep -qi "not permitted to create or approve pull requests"; then
              echo "Branch '${RELEASE_BRANCH}' pushed and CI triggered."
              echo "GitHub repository policy blocks GITHUB_TOKEN from auto-creating PRs."
              echo "Open PR manually: ${COMPARE_URL}"
              {
                echo "### Release Branch Ready: \`${RELEASE_BRANCH}\`"
                echo ""
                echo "- CI has been dispatched on \`${RELEASE_BRANCH}\`."
                echo "- Auto-PR creation is disabled in **Settings -> Actions -> General -> Workflow permissions**."
                echo "- [Create & merge Release PR (${NEW_TAG})](${COMPARE_URL})"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${PR_OUT}" >&2
              exit "${PR_RC}"
            fi
          else
            gh pr edit "${EXISTING_PR}" --title "${PR_TITLE}" --body "${PR_BODY}"
            echo "Updated Release PR #${EXISTING_PR} for \`${NEW_TAG}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  tag-on-merge:
    name: Tag Merged Release on Main
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_publish: ${{ steps.tag.outputs.should_publish }}
      tag: ${{ steps.tag.outputs.tag }}
      clean_version: ${{ steps.tag.outputs.clean_version }}
      build_desktop: ${{ steps.tag.outputs.build_desktop }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config --global user.name "Ravinder Singh"
          git config --global user.email "251900306+sainibhaowal@users.noreply.github.com"

      - name: Verify & Tag Release
        id: tag
        run: |
          git fetch --force --tags origin
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping release."
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          npm run verify:release
          git tag -a "${TAG}" -m "chore(release): ${VERSION}"
          git push origin "${TAG}"

          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "${COMMIT_MSG}" | grep -q '\[build-desktop\]'; then
            echo "build_desktop=true" >> $GITHUB_OUTPUT
          else
            echo "build_desktop=false" >> $GITHUB_OUTPUT
          fi

          echo "should_publish=true" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${VERSION}" >> $GITHUB_OUTPUT

  build-and-publish:
    name: Build, Smoke-Test & Publish Images
    runs-on: ubuntu-latest
    needs: [tag-on-merge]
    if: always() && (github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && needs.tag-on-merge.result == 'success' && needs.tag-on-merge.outputs.should_publish == 'true'))
    outputs:
      tag: ${{ steps.vars.outputs.TAG }}
      version: ${{ steps.vars.outputs.VERSION }}
    env:
      REGISTRY: ghcr.io
      IMAGE_BACKEND: ${{ github.repository_owner }}/aurelinx-backend
      IMAGE_FRONTEND: ${{ github.repository_owner }}/aurelinx-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep desktop artifacts aligned with the released container images.
          ref: ${{ github.ref_type == 'tag' && github.ref || needs.tag-on-merge.outputs.tag }}

      - name: Determine Target Version
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ needs.tag-on-merge.outputs.tag }}"
          fi
          CLEAN_VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 1. Build & Push Backend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./infra/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 2. Build & Push Frontend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./infra/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://aurelinx.averqel.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 3. Verify Container Images (Smoke Test)
        run: |
          echo "==> Verifying backend container image..."
          docker run --rm \
            -e ALLOW_SQLITE=1 \
            -e DATABASE_URL="sqlite:///:memory:" \
            -e SECRET_KEY="test-secret-key-at-least-32-characters-long" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.VERSION }} \
            python -c "import app.main; print('✓ Backend container application imports successfully')"

          echo "==> Verifying frontend container image..."
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.VERSION }} \
            node -e "console.log('✓ Frontend container runtime verified:', process.version)"

      - name: 4. Generate Release Notes
        id: release_notes
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^v${VERSION}$" | head -n 1 || true)
          echo "### What's Changed in v${VERSION}" > NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --grep="^feat" >> NOTES.md || true
          else
            git log -n 15 --pretty=format:"- %s (%h)" --grep="^feat" >> NOTES.md || true
          fi
          echo "" >> NOTES.md
          echo "### Bug Fixes & Refactoring" >> NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --grep="^fix\|^chore\|^refactor\|^ci\|^docs" >> NOTES.md || true
          else
            git log -n 15 --pretty=format:"- %s (%h)" --grep="^fix\|^chore\|^refactor\|^ci\|^docs" >> NOTES.md || true
          fi
          echo "" >> NOTES.md
          echo "---" >> NOTES.md
          echo "**Container Images:**" >> NOTES.md
          echo "- \`ghcr.io/${{ github.repository_owner }}/aurelinx-backend:${VERSION}\`" >> NOTES.md
          echo "- \`ghcr.io/${{ github.repository_owner }}/aurelinx-frontend:${VERSION}\`" >> NOTES.md

      - name: 5. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: Aurelinx ${{ steps.vars.outputs.TAG }}
          body_path: NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-binaries:
    name: Build & Attach Desktop Binaries
    runs-on: ${{ matrix.os }}
    needs: [tag-on-merge, build-and-publish]
    # Rust/Tauri packaging is deliberately opt-in. Normal releases serve the
    # web application and deploy containers without waiting for desktop builds.
    if: needs.build-and-publish.result == 'success' && needs.tag-on-merge.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: nsis
          - os: ubuntu-22.04
            target_name: deb
            ubuntu_codename: jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Attach installers built from the exact semantic-release tag.
          ref: ${{ needs.build-and-publish.outputs.tag }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore desktop build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-desktop-tauri-${{ hashFiles('desktop/package-lock.json', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-tauri-

      - name: Restore Linux package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-desktop-apt-v1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit

      - name: Resolve App URL
        id: app_url
        shell: bash
        run: |
          APP_URL="${{ vars.AURELINX || vars.AURELINX_URL_APP || vars.AURELINX_APP_URL || vars.AURELIUS || vars.AURELIUS_URL_APP || vars.AURELIUS_APP_URL || 'https://aurelinx.averqel.com/app' }}"
          echo "APP_URL=${APP_URL}" >> $GITHUB_OUTPUT

      - name: Prepare desktop config
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
        run: npm run prepare:config

      - name: Build desktop package
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-publish.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
