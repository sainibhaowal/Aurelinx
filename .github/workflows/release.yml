name: Semantic Release, Container & Desktop Build

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto, patch, minor, major)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  version-and-tag:
    name: Generate Semantic Version & Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      new_tag: ${{ steps.bump.outputs.tag }}
      clean_version: ${{ steps.bump.outputs.clean_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Release Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Bump Version
        id: bump
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "auto" ]; then
            npx standard-version
          else
            npx standard-version --release-as ${{ github.event.inputs.release_type }}
          fi
          NEW_TAG=$(git describe --tags --abbrev=0)
          CLEAN_VER="${NEW_TAG#v}"
          echo "tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          git push --follow-tags origin ${{ github.ref_name }}

  build-and-publish:
    name: Build, Smoke-Test & Publish Images
    runs-on: ubuntu-latest
    needs: [version-and-tag]
    if: always() && (github.event_name == 'push' || needs.version-and-tag.result == 'success')
    outputs:
      tag: ${{ steps.vars.outputs.TAG }}
      version: ${{ steps.vars.outputs.VERSION }}
    env:
      REGISTRY: ghcr.io
      IMAGE_BACKEND: ${{ github.repository_owner }}/aurelinx-backend
      IMAGE_FRONTEND: ${{ github.repository_owner }}/aurelinx-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep desktop artifacts aligned with the released container images.
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.version-and-tag.outputs.new_tag || github.ref }}

      - name: Determine Target Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ needs.version-and-tag.outputs.new_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 1. Build & Push Backend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./infra/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 2. Build & Push Frontend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./infra/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://aurelinx.averqel.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 3. Verify Container Images (Smoke Test)
        run: |
          echo "==> Verifying backend container image..."
          docker run --rm \
            -e ALLOW_SQLITE=1 \
            -e DATABASE_URL="sqlite:///:memory:" \
            -e SECRET_KEY="test-secret-key-at-least-32-characters-long" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.VERSION }} \
            python -c "import app.main; print('✓ Backend container application imports successfully')"

          echo "==> Verifying frontend container image..."
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.VERSION }} \
            node -e "console.log('✓ Frontend container runtime verified:', process.version)"

      - name: 4. Generate Release Notes
        id: release_notes
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^v${VERSION}$" | head -n 1 || true)
          echo "### What's Changed in v${VERSION}" > NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --grep="^feat" >> NOTES.md || true
          else
            git log -n 15 --pretty=format:"- %s (%h)" --grep="^feat" >> NOTES.md || true
          fi
          echo "" >> NOTES.md
          echo "### Bug Fixes & Refactoring" >> NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --grep="^fix\|^chore\|^refactor\|^ci\|^docs" >> NOTES.md || true
          else
            git log -n 15 --pretty=format:"- %s (%h)" --grep="^fix\|^chore\|^refactor\|^ci\|^docs" >> NOTES.md || true
          fi
          echo "" >> NOTES.md
          echo "---" >> NOTES.md
          echo "**Container Images:**" >> NOTES.md
          echo "- \`ghcr.io/${{ github.repository_owner }}/aurelinx-backend:${VERSION}\`" >> NOTES.md
          echo "- \`ghcr.io/${{ github.repository_owner }}/aurelinx-frontend:${VERSION}\`" >> NOTES.md

      - name: 5. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: Aurelinx ${{ steps.vars.outputs.TAG }}
          body_path: NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-binaries:
    name: Build & Attach Desktop Binaries
    runs-on: ${{ matrix.os }}
    needs: [build-and-publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: nsis
          - os: ubuntu-22.04
            target_name: deb
            ubuntu_codename: jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Attach installers built from the exact semantic-release tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.version-and-tag.outputs.new_tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore desktop build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-desktop-tauri-${{ hashFiles('desktop/package-lock.json', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-tauri-

      - name: Restore Linux package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-desktop-apt-v1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Resolve App URL
        id: app_url
        shell: bash
        run: |
          APP_URL="${{ vars.AURELINX || vars.AURELINX_URL_APP || vars.AURELINX_APP_URL || vars.AURELIUS || vars.AURELIUS_URL_APP || vars.AURELIUS_APP_URL || 'https://aurelinx.averqel.com/app' }}"
          echo "APP_URL=${APP_URL}" >> $GITHUB_OUTPUT

      - name: Prepare desktop config
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
        run: npm run prepare:config

      - name: Build desktop package
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-publish.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
