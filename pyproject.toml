[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "node_modules", "client", "desktop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends/Field)
    "B904",  # raise from None / err
]

[tool.ruff.lint.per-file-ignores]
"server/tests/*" = ["E402"]
"server/scripts/*" = ["E402"]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker", "scripts"]

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.venv
  | node_modules
  | client
  | desktop
)/
'''
