name: Desktop Release & Aurelinx OS Code Signing

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "desktop-v*"

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: nsis
          - os: ubuntu-22.04
            target_name: deb
            ubuntu_codename: jammy
          - os: ubuntu-24.04
            target_name: deb
            ubuntu_codename: noble
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Resolve App URL
        id: app_url
        shell: bash
        run: |
          APP_URL="${{ vars.AURELINX || vars.AURELINX_URL_APP || vars.AURELINX_APP_URL || vars.AURELIUS || vars.AURELIUS_URL_APP || vars.AURELIUS_APP_URL || 'https://aurelinx.averqel.com/app' }}"
          echo "APP_URL=${APP_URL}" >> $GITHUB_OUTPUT

      - name: Prepare desktop config
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
        run: npm run prepare:config

      - name: Build desktop package
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # ===================================================
      # AURELINX OS CODE SIGNING: Digital Publisher Signature
      # ===================================================
      - name: Sign Windows Executable with Aurelinx OS Publisher Certificate
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Write-Host "Generating Aurelinx OS Code Signing Certificate..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Aurelinx OS, O=Aurelinx, OU=Engineering, C=US" `
            -KeyAlgorithm RSA -KeyLength 3072 `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)

          # Export public .cer for users to trust
          $cerPath = "desktop\src-tauri\target\release\bundle\nsis\Aurelinx.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath
          Copy-Item "desktop\scripts\install-aurelinx-cert.bat" "desktop\src-tauri\target\release\bundle\nsis\"
          Copy-Item "desktop\scripts\install-aurelinx-cert.ps1" "desktop\src-tauri\target\release\bundle\nsis\"

          # Export password-protected PFX
          $password = ConvertTo-SecureString -String "Aurelinx2026Secure!" -Force -AsPlainText
          $pfxPath = "desktop\Aurelinx.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password

          # Find signtool.exe in Windows SDK
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
          Write-Host "Using signtool at: $signtool"

          # Sign all NSIS .exe installers
          $exeFiles = Get-ChildItem "desktop\src-tauri\target\release\bundle\nsis\*.exe"
          foreach ($exe in $exeFiles) {
            Write-Host "Signing executable: $($exe.FullName) with Aurelinx OS..."
            & $signtool sign /f $pfxPath /p "Aurelinx2026Secure!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /d "Aurelinx OS" /du "https://aurelinx.averqel.com" $exe.FullName
            & $signtool verify /pa /v $exe.FullName
          }
          Write-Host "Aurelinx OS digital signature applied successfully!"

      # ===================================================
      # ATTACH ASSETS TO GITHUB RELEASE
      # ===================================================
      - name: Upload Release Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/Aurelinx.cer
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows CI Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aurelinx-windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/Aurelinx.cer
            desktop/src-tauri/target/release/bundle/nsis/install-aurelinx-cert.bat

      - name: Upload Linux CI Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: aurelinx-linux-${{ matrix.ubuntu_codename }}
          path: desktop/src-tauri/target/release/bundle/deb/*.deb