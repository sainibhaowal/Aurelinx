name: Desktop Release & Code Signing

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "desktop-v*"

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: nsis
          - os: ubuntu-22.04
            target_name: deb
            ubuntu_codename: jammy
          - os: ubuntu-24.04
            target_name: deb
            ubuntu_codename: noble
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Resolve App URL
        id: app_url
        shell: bash
        run: |
          APP_URL="${{ vars.AURELINX || vars.AURELINX_URL_APP || vars.AURELINX_APP_URL || 'https://aurelinx.averqel.com/app' }}"
          echo "APP_URL=${APP_URL}" >> $GITHUB_OUTPUT

      - name: Prepare desktop config
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
        run: npm run prepare:config

      - name: Build desktop package
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # ===================================================
      # SIGNPATH FOUNDATION: Windows Code Signing Integration
      # ===================================================
      - name: Prepare Windows Executable for SignPath Signing
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        shell: bash
        run: |
          mkdir -p desktop/signing-package
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe desktop/signing-package/
          cd desktop/signing-package
          7z a ../unsigned-release.zip *
          cd ../..
          echo "Prepared unsigned release package for SignPath Foundation verification."

      - name: Sign Windows Installer via SignPath Foundation
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'aurelinx' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          input-artifact-filepath: desktop/unsigned-release.zip
          output-artifact-directory: desktop/signed-release

      - name: Replace Unsigned Binary with Signed Binary
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        shell: bash
        run: |
          if [ -d "desktop/signed-release" ]; then
            cp -f desktop/signed-release/*.exe desktop/src-tauri/target/release/bundle/nsis/
            echo "Successfully replaced installer with SignPath digitally signed executable."
          fi

      # ===================================================
      # ATTACH ASSETS TO GITHUB RELEASE
      # ===================================================
      - name: Upload Release Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows CI Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aurelinx-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Linux CI Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: aurelinx-linux-${{ matrix.ubuntu_codename }}
          path: desktop/src-tauri/target/release/bundle/deb/*.deb