# -------------------------------------------------
# infra/docker-compose.local.yml   (commit this)
# -------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./.env.local
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ./.env.local
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'healthz check passed'"]
      interval: 10s
      timeout: 3s
      retries: 10

  # -------------------------------------------------
  #  APP SERVICES – **build locally**, hot‑reload
  # -------------------------------------------------
  api:
    build:
      context: ../server
      dockerfile: ../infra/backend.Dockerfile
      target: base                # the first stage (has source, dev deps)
    restart: unless-stopped
    env_file: ./.env.local
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      PYTHONPATH: /app
      CHAT_UPLOAD_ROOT: ${CHAT_UPLOAD_ROOT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "${API_PORT}:5000"
    volumes:
      - ../server:/app            # hot‑reload source
      - chat_uploads:/app/data/chat
    command: ["sh","-c","python -c \"import time, socket; [time.sleep(1) for _ in range(30) if socket.socket().connect_ex(('postgres', 5432)) != 0]\"; alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ../server
      dockerfile: ../infra/backend.Dockerfile
      target: base
    restart: unless-stopped
    env_file: ./.env.local
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh","-lc","PYTHONPATH=/app python scripts/retry_worker.py"]
    volumes:
      - ../server:/app

  scheduler:
    build:
      context: ../server
      dockerfile: ../infra/backend.Dockerfile
      target: base
    restart: unless-stopped
    env_file: ./.env.local
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh","-lc","PYTHONPATH=/app python scripts/retry_scheduler.py"]
    volumes:
      - ../server:/app

  web:
    build:
      context: ../client
      dockerfile: ../infra/frontend.Dockerfile
      target: builder             # the *builder* stage (has node_modules, runs `next dev`)
    restart: unless-stopped
    env_file: ./.env.local
    environment:
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:3000"
    volumes:
      - ../client:/app
      - /app/node_modules          # keep container‑local node_modules
      - /app/.next
    command: ["npm","run","dev"]   # Next.js dev server with hot‑reload
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  chat_uploads:
  caddy_data:
  caddy_config: