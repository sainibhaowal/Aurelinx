name: Desktop Build & Release Attach

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build & attach installers to (default: latest semantic tag)'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve Target Semantic Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Target Tag
        id: resolve
        run: |
          git fetch --force --tags origin
          INPUT_TAG="${{ inputs.tag }}"
          if [ "${INPUT_TAG}" = "latest" ] || [ -z "${INPUT_TAG}" ]; then
            TARGET_TAG=$(git tag --list "v[0-9]*" --sort=-version:refname | head -n 1 || true)
            if [ -z "${TARGET_TAG}" ]; then
              echo "No semantic release tags (v*) found on origin." >&2
              exit 1
            fi
          else
            TARGET_TAG="${INPUT_TAG}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TARGET_TAG}" >/dev/null 2>&1; then
              echo "Tag '${TARGET_TAG}' does not exist on origin." >&2
              exit 1
            fi
          fi
          echo "Resolved desktop build target tag: ${TARGET_TAG}"
          echo "tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "### Building desktop installers for \`${TARGET_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  build-desktop-binaries:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: [resolve-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - label: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - label: windows-arm64
            os: windows-latest
            rust_target: aarch64-pc-windows-msvc
          - label: macos-x64
            os: macos-14
            rust_target: x86_64-apple-darwin
          - label: macos-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync Release Metadata to Tag
        shell: bash
        run: |
          git fetch --force --tags origin
          node scripts/reconcile-release-version.js
          node scripts/verify-release-metadata.js

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Restore desktop build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ matrix.label }}-desktop-tauri-${{ hashFiles('desktop/package-lock.json', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-desktop-tauri-

      - name: Restore Linux package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ matrix.label }}-desktop-apt-v1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            rpm

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit

      - name: Resolve App URL
        id: app_url
        shell: bash
        run: |
          APP_URL="${{ vars.AURELINX || vars.AURELINX_URL_APP || vars.AURELINX_APP_URL || vars.AURELIUS || vars.AURELIUS_URL_APP || vars.AURELIUS_APP_URL || 'https://aurelinx.averqel.com/app' }}"
          echo "APP_URL=${APP_URL}" >> "$GITHUB_OUTPUT"

      - name: Prepare desktop config
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
        run: npm run prepare:config

      - name: Build desktop package (${{ matrix.label }})
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --target ${{ matrix.rust_target }}

      - name: Upload Desktop Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  attach-to-release:
    name: Attach Installers to GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-tag, build-desktop-binaries]
    if: ${{ always() && needs.resolve-tag.result == 'success' && (needs.build-desktop-binaries.result == 'success' || needs.build-desktop-binaries.result == 'failure') }}
    steps:
      - name: Download Built Desktop Installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          path: release-assets
          merge-multiple: true

      - name: List Collected Installers
        run: |
          find release-assets -type f | sort || true

      - name: Attach Installers to Existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
