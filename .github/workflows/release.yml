name: Semantic Release, Container & Desktop Build

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto, patch, minor, major)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      build_desktop:
        description: 'Build desktop installers (slow; leave off for web/API releases)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

# One release operation may calculate and publish a version for a branch at a
# time. This prevents two manual runs from selecting the same next tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic Version & Tag (main)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      clean_version: ${{ steps.release.outputs.clean_version }}
    steps:
      - name: Enforce main branch only
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Semantic Release must only run from the 'main' branch (got '${GITHUB_REF}')." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Configure Git User
        run: |
          git config --global user.name "Ravinder Singh"
          git config --global user.email "251900306+sainibhaowal@users.noreply.github.com"

      - name: Install Release Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Calculate Next Semantic Version & Tag Main
        id: release
        run: |
          git fetch --force --tags origin

          EXISTING_HEAD_TAG=$(git tag --points-at HEAD --list "v[0-9]*" --sort=-version:refname | head -n 1 || true)
          if [ -n "${EXISTING_HEAD_TAG}" ] && [ "${{ github.event.inputs.release_type }}" = "auto" ]; then
            echo "Current main HEAD is already released as ${EXISTING_HEAD_TAG}. Merge new commits to main before creating the next auto release (or pick patch/minor/major explicitly)." >&2
            exit 1
          fi

          node scripts/reconcile-release-version.js
          npm run verify:release

          if [ "${{ github.event.inputs.release_type }}" = "auto" ]; then
            npx standard-version --skip.changelog --skip.commit --skip.tag
          else
            npx standard-version --skip.changelog --skip.commit --skip.tag --release-as ${{ github.event.inputs.release_type }}
          fi

          NEW_VER=$(node -p "require('./package.json').version")
          NEW_TAG="v${NEW_VER}"

          if git ls-remote --exit-code --tags origin "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing remote release tag: ${NEW_TAG}" >&2
            exit 1
          fi
          npm run verify:release

          # Tag main HEAD directly so protected main never requires a bypass PAT or extra release PR.
          git tag -a "${NEW_TAG}" -m "chore(release): ${NEW_VER}"
          git push origin "${NEW_TAG}"

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${NEW_VER}" >> "$GITHUB_OUTPUT"
          echo "### Tagged \`${NEW_TAG}\` on \`main\` ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

  build-backend:
    name: Build & Smoke-Test Backend Image
    runs-on: ubuntu-latest
    needs: [semantic-release]
    env:
      REGISTRY: ghcr.io
      IMAGE_BACKEND: ${{ github.repository_owner }}/aurelinx-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.semantic-release.outputs.tag }}

      - name: Sync Metadata to Tag
        run: |
          git fetch --force --tags origin
          node scripts/reconcile-release-version.js
          node scripts/verify-release-metadata.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./infra/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ needs.semantic-release.outputs.clean_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke-Test Backend Container Image
        run: |
          docker run --rm \
            -e ALLOW_SQLITE=1 \
            -e DATABASE_URL="sqlite:///:memory:" \
            -e SECRET_KEY="test-secret-key-at-least-32-characters-long" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ needs.semantic-release.outputs.clean_version }} \
            python -c "import app.main; print('✓ Backend container application imports successfully')"

  build-frontend:
    name: Build & Smoke-Test Frontend Image
    runs-on: ubuntu-latest
    needs: [semantic-release]
    env:
      REGISTRY: ghcr.io
      IMAGE_FRONTEND: ${{ github.repository_owner }}/aurelinx-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.semantic-release.outputs.tag }}

      - name: Sync Metadata to Tag
        run: |
          git fetch --force --tags origin
          node scripts/reconcile-release-version.js
          node scripts/verify-release-metadata.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./infra/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ needs.semantic-release.outputs.clean_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://aurelinx.averqel.com' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke-Test Frontend Container Image
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ needs.semantic-release.outputs.clean_version }} \
            node -e "console.log('✓ Frontend container runtime verified:', process.version)"

  build-desktop-binaries:
    name: Build Desktop Binaries
    runs-on: ${{ matrix.os }}
    needs: [semantic-release]
    # Rust/Tauri packaging is deliberately opt-in. Normal releases serve the
    # web application and deploy containers without waiting for desktop builds.
    if: needs.semantic-release.result == 'success' && inputs.build_desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: nsis
          - os: ubuntu-22.04
            target_name: deb
            ubuntu_codename: jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Build installers from the exact semantic-release tag in parallel with container builds.
          ref: ${{ needs.semantic-release.outputs.tag }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync Release Metadata to Tag
        shell: bash
        run: |
          git fetch --force --tags origin
          node scripts/reconcile-release-version.js
          node scripts/verify-release-metadata.js

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore desktop build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-desktop-tauri-${{ hashFiles('desktop/package-lock.json', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-tauri-

      - name: Restore Linux package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-desktop-apt-v1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit

      - name: Resolve App URL
        id: app_url
        shell: bash
        run: |
          APP_URL="${{ vars.AURELINX || vars.AURELINX_URL_APP || vars.AURELINX_APP_URL || vars.AURELIUS || vars.AURELIUS_URL_APP || vars.AURELIUS_APP_URL || 'https://aurelinx.averqel.com/app' }}"
          echo "APP_URL=${APP_URL}" >> $GITHUB_OUTPUT

      - name: Prepare desktop config
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
        run: npm run prepare:config

      - name: Build desktop package
        working-directory: desktop
        env:
          AURELINX_APP_URL: ${{ steps.app_url.outputs.APP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload Desktop Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.target_name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [semantic-release, build-backend, build-frontend, build-desktop-binaries]
    if: ${{ always() && needs.semantic-release.result == 'success' && needs.build-backend.result == 'success' && needs.build-frontend.result == 'success' && (needs.build-desktop-binaries.result == 'success' || needs.build-desktop-binaries.result == 'skipped') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.semantic-release.outputs.tag }}

      - name: Generate Release Notes
        run: |
          VERSION="${{ needs.semantic-release.outputs.clean_version }}"
          PREV_TAG=$(git tag --merged HEAD --list "v[0-9]*" --sort=-version:refname | grep -v "^v${VERSION}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="-n 15"
          fi
          FEATURES=$(git log $RANGE --pretty=format:"- %s (%h)" --regexp-ignore-case --grep="^feat" || true)
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" --regexp-ignore-case --grep="^fix\|^chore\|^refactor\|^ci\|^docs" || true)
          {
            echo "### What's Changed in v${VERSION}"
            if [ -n "$FEATURES" ]; then
              echo "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              echo ""
              echo "### Bug Fixes, Maintenance & CI"
              echo "$FIXES"
            fi
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ]; then
              git log $RANGE --pretty=format:"- %s (%h)" || true
            fi
            echo ""
            echo "---"
            echo "**Container Images:**"
            echo "- \`ghcr.io/${{ github.repository_owner }}/aurelinx-backend:${VERSION}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/aurelinx-frontend:${VERSION}\`"
          } > NOTES.md

      - name: Download Desktop Installer Artifacts
        if: inputs.build_desktop
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        if: ${{ !inputs.build_desktop }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semantic-release.outputs.tag }}
          name: Aurelinx ${{ needs.semantic-release.outputs.tag }}
          body_path: NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release with Desktop Binaries
        if: ${{ inputs.build_desktop }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semantic-release.outputs.tag }}
          name: Aurelinx ${{ needs.semantic-release.outputs.tag }}
          body_path: NOTES.md
          generate_release_notes: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.deb
            release-assets/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
