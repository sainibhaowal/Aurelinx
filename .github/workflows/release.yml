name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_BACKEND: ${{ github.repository_owner }}/aurelinx-backend
      IMAGE_FRONTEND: ${{ github.repository_owner }}/aurelinx-frontend
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./infra/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./infra/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate professional release notes
        id: release_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PREV_TAG=$(git tag --sort=-version:refname | sed -n 2p)
          echo "### What's Changed" > NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --grep="^feat" >> NOTES.md || true
          fi
          echo "" >> NOTES.md
          echo "### Bug Fixes & Improvements" >> NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --grep="^fix\|^chore\|^refactor\|^ci\|^docs" >> NOTES.md || true
          fi
          echo "" >> NOTES.md
          echo "---" >> NOTES.md
          echo "**Images:**" >> NOTES.md
          echo "- \`ghcr.io/sainibhaowal/aurelinx-backend:$VERSION\`" >> NOTES.md
          echo "- \`ghcr.io/sainibhaowal/aurelinx-frontend:$VERSION\`" >> NOTES.md
          echo "**Deployment:** Automatically deployed to production (aurelinx.averqel.com)." >> NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aurelinx v${{ steps.vars.outputs.VERSION }}
          body_path: NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Required secrets (configure in repo Settings → Secrets → Actions):
    #   VPS_HOST        - IP or hostname of the VPS
    #   VPS_USER        - SSH user with docker rights (e.g. deploy)
    #   VPS_SSH_KEY     - Private SSH key (no passphrase) for VPS_USER
    #   VPS_DEPLOY_DIR  - Absolute path on VPS where docker-compose.yml lives (e.g. /opt/aurelinx)
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          GHCR_OWNER: ${{ github.repository_owner }}
          DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -euo pipefail
            cd \"${DEPLOY_DIR}\"
            # Login to GHCR on the VPS using the PAT (read:packages) secret
            echo \"${GHCR_PAT}\" | docker login ghcr.io -u \"${GHCR_OWNER}\" --password-stdin
            printf 'GHCR_OWNER=%s\nVERSION=%s\n' \"${GHCR_OWNER}\" \"${VERSION}\" > .env.deploy
            docker compose --env-file .env.production --env-file .env.deploy pull
            docker compose --env-file .env.production --env-file .env.deploy up -d --remove-orphans
            sleep 5
            curl -fsS http://localhost:5100/health | jq -e \".version==\\\"${VERSION}\\\"\" && echo \"Deployed ${VERSION}\"
          "